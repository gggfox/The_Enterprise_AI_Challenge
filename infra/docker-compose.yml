services:
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3111:3111"
    env_file:
      - ../.env
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
    depends_on:
      - openobserve
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3111/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Self-hosted OpenObserve for OTLP traces, metrics, and logs.
  # Single binary -- not the heavyweight clickhouse-fronted SigNoz stack.
  # UI on :5080, OTLP HTTP on :5081 (disabled by default in OpenObserve;
  # we explicitly enable it via ZO_OTLP_ENABLED below).
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v0.14.4
    ports:
      - "5080:5080"
      - "5081:5081"
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-admin@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-replace-me-openobserve}
      ZO_DATA_DIR: /data
      ZO_OTLP_HTTP_PORT: "5081"
    volumes:
      - openobserve-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  openobserve-data:
